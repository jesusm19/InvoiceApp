<div class="container">
        <div class="card my-3">
            <div class="card-header">
                <h2>Facturas</h2>
            </div>
            <div class="card-body">

                <app-invoice-view [invoiceId]="invoice.id" [invoiceName]="invoice.client.name"></app-invoice-view>

                
                <div class="row my-3">
                    <div class="col">
                        <app-client-view [client]="invoice.client"></app-client-view>
                    </div>
    
                    <div class="col">
                        <app-company-view [company]="invoice.company"></app-company-view>
                    </div>
                    
                </div>

                <div>
                    <app-list-items [items]="invoice.items"></app-list-items>
                </div>
            </div>
            

        </div>
</div>
